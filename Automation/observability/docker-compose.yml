# ═══════════════════════════════════════════════════════════════════
# Desert Fish — Observability Stack
# Runs on the Oracle Cloud VM (or any Linux host with Docker).
#
# Components:
#   Prometheus     → Scrapes metrics from SNMP Exporter
#   SNMP Exporter  → Polls switches via SNMPv3 (interface stats, CPU, RAM)
#   Loki           → Receives syslog from switches via Promtail
#   Promtail       → Syslog listener (UDP 514) → ships logs to Loki
#   Grafana        → Dashboards — single pane of glass
#   Alertmanager   → Routes alerts to email/Slack on threshold breach
#
# HOW TO START:
#   cd observability/
#   cp .env.example .env       # fill in your passwords
#   docker compose up -d
#   # Open Grafana at http://<your-vm-ip>:3000
# ═══════════════════════════════════════════════════════════════════

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

  snmp-exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp-exporter
    restart: unless-stopped
    ports:
      - "9116:9116"
    volumes:
      - ./snmp-exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    ports:
      - "514:1514/udp"    # switches send syslog to UDP 514
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS:-ChangeMe!}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
