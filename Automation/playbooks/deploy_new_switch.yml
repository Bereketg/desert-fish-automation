---
# ═══════════════════════════════════════════════════════════════════
# Desert Fish — Deploy New Access Switch (Day-0 / Day-1)
#
# WHAT IT DOES:
#   1. Backs up the switch's current running config
#   2. Renders the Jinja2 template and pushes to the switch
#   3. Saves to startup-config (survives reboot)
#   4. Validates VLANs and MGMT SVI are up
#
# HOW TO RUN:
#   # Dry-run first (no changes applied):
#   ansible-playbook playbooks/deploy_new_switch.yml \
#     -i inventories/clab_inventory.yml \
#     --limit LON-ACC1 \
#     --vault-password-file ~/.vault_pass \
#     --check --diff
#
#   # Apply for real:
#   ansible-playbook playbooks/deploy_new_switch.yml \
#     -i inventories/clab_inventory.yml \
#     --limit LON-ACC1 \
#     --vault-password-file ~/.vault_pass
#
# NOTES:
#   - Auth vars (ansible_user, ansible_password, ansible_become_password)
#     come from group_vars/all/vault.yml via inventory — do NOT override
#     them at play level, it causes vault variable scope conflicts.
#   - ios_config src: renders the .j2 template in the host's variable
#     context directly — no delegate_to: localhost needed.
# ═══════════════════════════════════════════════════════════════════

- name: "Desert Fish — Deploy Access Switch"
  hosts: access_switches
  gather_facts: false

  tasks:

    # ── STEP 1: Backup ────────────────────────────────────────────────────────
    # Save a timestamped copy of the running config before any changes.
    # If something goes wrong you can restore from this file.
    - name: "1/4  Back up current running config"
      cisco.ios.ios_command:
        commands: "show running-config"
      register: backup_output

    - name: "1/4  Save backup to local file"
      ansible.builtin.copy:
        content: "{{ backup_output.stdout[0] }}"
        dest: "/tmp/{{ inventory_hostname }}_backup.txt"
      delegate_to: localhost

    # ── STEP 2: Render and apply ──────────────────────────────────────────────
    # ios_config renders the Jinja2 template in the current host's variable
    # context (including all vault vars) and pushes lines to the device.
    # IOS-XE only applies lines that differ from the running config (idempotent).
    - name: "2/4  Render Jinja2 template and apply config to switch"
      cisco.ios.ios_config:
        src:       "{{ playbook_dir }}/../templates/access_switch.j2"
        save_when: changed
      register: config_result

    - name: "2/4  Show changed lines"
      ansible.builtin.debug:
        msg: "Lines changed: {{ config_result.updates | default([]) }}"

    # ── STEP 3: Verify VLANs ─────────────────────────────────────────────────
    - name: "3/4  Verify VLANs are active"
      cisco.ios.ios_command:
        commands: "show vlan brief"
      register: vlan_output

    - name: "3/4  Confirm VLANs 10, 20, 30, 60 exist"
      ansible.builtin.assert:
        that:
          - "'10' in vlan_output.stdout[0]"
          - "'20' in vlan_output.stdout[0]"
          - "'30' in vlan_output.stdout[0]"
          - "'60' in vlan_output.stdout[0]"
        fail_msg:    "ERROR: Expected VLANs missing — check template rendering"
        success_msg: "PASS: All VLANs present"

    # ── STEP 4: Verify MGMT SVI ───────────────────────────────────────────────
    - name: "4/4  Confirm MGMT SVI (Vlan10) is up"
      cisco.ios.ios_command:
        commands: "show interface Vlan10 | include line protocol"
      register: svi_output

    - name: "4/4  Assert SVI is up"
      ansible.builtin.assert:
        that: "'up' in svi_output.stdout[0]"
        fail_msg:    "WARNING: Vlan10 SVI not up — check uplinks and IP config"
        success_msg: "PASS: MGMT SVI is up"

    - name: "Deployment complete"
      ansible.builtin.debug:
        msg: "✓ {{ inventory_hostname }} deployed successfully"
