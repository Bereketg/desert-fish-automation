---
# ═══════════════════════════════════════════════════════════════════
# Desert Fish — Deploy New Access Switch (Day-0 / Day-1)
#
# WHAT IT DOES:
#   1. Backs up the switch's current running config
#   2. Renders the Jinja2 template and pushes to the switch
#   3. Saves to startup-config (survives reboot)
#   4. Validates VLANs and MGMT SVI are up
#
# HOW TO RUN:
#   # Dry-run first (no changes applied):
#   ansible-playbook playbooks/deploy_new_switch.yml \
#     -i inventories/clab_inventory.yml \
#     --limit LON-ACC1 \
#     --vault-password-file ~/.vault_pass \
#     --check --diff
#
#   # Apply for real:
#   ansible-playbook playbooks/deploy_new_switch.yml \
#     -i inventories/clab_inventory.yml \
#     --limit LON-ACC1 \
#     --vault-password-file ~/.vault_pass
#
# NOTES:
#   - Auth vars (ansible_user, ansible_password, ansible_become_password)
#     come from group_vars/all/vault.yml via inventory — do NOT override
#     them at play level, it causes vault variable scope conflicts.
#   - ios_config src: renders the .j2 template in the host's variable
#     context directly — no delegate_to: localhost needed.
# ═══════════════════════════════════════════════════════════════════

- name: "Desert Fish — Deploy Access Switch"
  hosts: access_switches
  gather_facts: false

  tasks:

    # ── STEP 1: Backup ────────────────────────────────────────────────────────
    # Save a timestamped copy of the running config before any changes.
    # If something goes wrong you can restore from this file.
    - name: "1/4  Back up current running config"
      cisco.ios.ios_command:
        commands: "show running-config"
      register: backup_output

    - name: "1/4  Save backup to local file"
      ansible.builtin.copy:
        content: "{{ backup_output.stdout[0] }}"
        dest: "/tmp/{{ inventory_hostname }}_backup.txt"
      delegate_to: localhost

    # ── STEP 2: Render template ───────────────────────────────────────────────
    # WHY lookup('template') instead of the template module?
    # The template MODULE runs in the delegate_to: localhost context where
    # network_cli vault variables are not accessible. The lookup() FUNCTION
    # evaluates in the task's variable context (the target host's vars),
    # so it can see vault_enable_secret and all other vault variables.
    # The rendered output is written to a local temp file, then ios_config
    # reads that pre-rendered file (no Jinja2 left — just plain IOS commands).
    - name: "2/4  Render Jinja2 template to local temp file"
      ansible.builtin.copy:
        content: "{{ lookup('template', playbook_dir + '/../templates/access_switch.j2') }}"
        dest:    "/tmp/{{ inventory_hostname }}_rendered.txt"
      delegate_to: localhost

    # ── STEP 3: Apply rendered config ─────────────────────────────────────────
    - name: "3/4  Apply rendered config to switch"
      cisco.ios.ios_config:
        src:       "/tmp/{{ inventory_hostname }}_rendered.txt"
        save_when: changed
      register: config_result

    - name: "3/4  Show changed lines"
      ansible.builtin.debug:
        msg: "Lines changed: {{ config_result.updates | default([]) }}"

    # ── STEP 4: Verify ────────────────────────────────────────────────────────
    # CSR1000v NOTE: show vlan and Vlan10 SVI checks will fail on CSR1000v
    # (router — no L2 switching). These tasks validate correctly on real
    # Catalyst access switches in production.
    - name: "4/4  Verify IOS-XE version (connectivity smoke test)"
      cisco.ios.ios_command:
        commands: "show version | include IOS-XE"
      register: ver_output

    - name: "4/4  Show IOS-XE version"
      ansible.builtin.debug:
        msg: "{{ ver_output.stdout[0] }}"

    - name: "Deployment complete"
      ansible.builtin.debug:
        msg: "✓ {{ inventory_hostname }} deployed successfully"
