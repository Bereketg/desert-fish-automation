[defaults]
# Where Ansible looks for roles and collections
collections_paths = ~/.ansible/collections

# Disable SSH host key checking in the lab — enable in production
host_key_checking = False

# Suppress deprecation warnings while learning
deprecation_warnings = False

# Retry files clutter the directory
retry_files_enabled = False

# Colour output
force_color = True

[persistent_connection]
# IOS-XE: keep SSH session alive between tasks
connect_timeout = 30
command_timeout = 30

[paramiko_connection]
# Paramiko (Python SSH library) ignores ANSIBLE_HOST_KEY_CHECKING.
# This section disables its own host key enforcement so stale keys
# in known_hosts don't block connections after container restarts.
host_key_auto_add = True
