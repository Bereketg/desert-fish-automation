  children:
    london:
      children:
        access_switches:
          hosts:
            LON-ACC1:
              ansible_host: "10.10.10.51"
            LON-ACC2:
              ansible_host: "10.10.10.52"
            LON-ACC3:
              ansible_host: "10.10.10.53"

        # Separate group for the DevNet lab switch (testing)
        lab:
          hosts:
            DEVNET-IOSXE:
              ansible_host: sandbox-iosxe-recomm-1.cisco.com
              ansible_user: developer
              ansible_password: C1sco12345
              ansible_become_password: C1sco12345
